<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="sans-serif" font-size="16">
  <rect width="900" height="300" fill="#fbfaf6"/>
  <g stroke="#6b8e23" stroke-width="2" fill="#ffffff">
    <rect x="30" y="60" width="180" height="110" rx="12"/>
    <rect x="270" y="60" width="200" height="110" rx="12"/>
    <rect x="530" y="60" width="160" height="110" rx="12"/>
    <rect x="730" y="60" width="140" height="110" rx="12"/>
  </g>
  <g fill="#333" text-anchor="middle">
    <text x="120" y="95" font-weight="bold">撮る</text>
    <text x="120" y="125">スマートフォンで</text>
    <text x="120" y="150">座標と時刻が写真に</text>
    <text x="370" y="95" font-weight="bold">話す</text>
    <text x="370" y="125">Claude が読み、問い返す</text>
    <text x="370" y="150">あなたが合う／違うを言う</text>
    <text x="610" y="95" font-weight="bold">記録</text>
    <text x="610" y="125">プロジェクトフォルダー</text>
    <text x="610" y="150">素の文字と写真</text>
    <text x="800" y="95" font-weight="bold">公開</text>
    <text x="800" y="125">「出す」と言った</text>
    <text x="800" y="150">行と写真だけ</text>
  </g>
  <g stroke="#6b8e23" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M210 115 L268 115"/>
    <path d="M470 115 L528 115"/>
    <path d="M690 115 L728 115"/>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b8e23"/></marker></defs>
  <g fill="#555" text-anchor="middle" font-size="15">
    <text x="450" y="225">「これからは収穫の量も記録して」「収穫の表の画面を作って」と話すと、</text>
    <text x="450" y="250">Claude が手引き（skill/）と画面（plugins/）を足します。アプリは、話すと写真の二つの画面だけ。</text>
  </g>
</svg>
