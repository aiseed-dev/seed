<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">
<title>配線図: 分けた後の形</title>
<rect width="960" height="660" fill="#ffffff"/>
<text x="24" y="30" font-size="18" fill="#1f2a1c" text-anchor="start" font-weight="700">分けた後の形（案。決めるのは作者）</text>
<ellipse cx="480" cy="62" rx="110" ry="26" fill="#eef2f6" stroke="#8a8f86" stroke-width="2"/><text x="480" y="67" font-size="15" fill="#1f2a1c" text-anchor="middle" font-weight="700">インターネット</text>
<line x1="480" y1="88" x2="480" y2="108" stroke="#1f2a1c" stroke-width="2.2"/>
<rect x="380" y="108" width="200" height="46" rx="10" fill="#ffffff" stroke="#8a8f86" stroke-width="2.2"/>
<text x="480.0" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2a1c">家のルーター（今の物）</text>
<line x1="480" y1="154" x2="480" y2="178" stroke="#1f2a1c" stroke-width="2.2"/>
<rect x="300" y="178" width="360" height="70" rx="10" fill="#f4f6f1" stroke="#1f2a1c" stroke-width="2.2"/>
<text x="480.0" y="202" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2a1c">新しいルーター（Debian。線の口が四つ）</text>
<text x="480.0" y="224" text-anchor="middle" font-size="13" fill="#5f6b5a">網を三つに分け、通す物を決める</text>
<line x1="390" y1="248" x2="390" y2="276" stroke="#1f2a1c" stroke-width="2.2"/>
<line x1="390" y1="276" x2="170" y2="276" stroke="#1f2a1c" stroke-width="2.2"/>
<line x1="170" y1="276" x2="170" y2="300" stroke="#1f2a1c" stroke-width="2.2"/>
<line x1="480" y1="248" x2="480" y2="300" stroke="#1f2a1c" stroke-width="2.2"/>
<line x1="570" y1="248" x2="570" y2="276" stroke="#1f2a1c" stroke-width="2.2"/>
<line x1="570" y1="276" x2="800" y2="276" stroke="#1f2a1c" stroke-width="2.2"/>
<line x1="800" y1="276" x2="800" y2="300" stroke="#1f2a1c" stroke-width="2.2"/>
<line x1="60" y1="300" x2="280" y2="300" stroke="#d9772b" stroke-width="4"/>
<text x="60" y="292" font-size="14" fill="#d9772b" text-anchor="start" font-weight="700">公開の網</text>
<line x1="320" y1="300" x2="650" y2="300" stroke="#4f7a34" stroke-width="4"/>
<text x="320" y="292" font-size="14" fill="#4f7a34" text-anchor="start" font-weight="700">中の網</text>
<line x1="700" y1="300" x2="900" y2="300" stroke="#356aa0" stroke-width="4"/>
<text x="900" y="292" font-size="14" fill="#356aa0" text-anchor="end" font-weight="700">机の網</text>
<line x1="170" y1="300" x2="170" y2="336" stroke="#1f2a1c" stroke-width="2.2"/>
<rect x="70" y="336" width="200" height="92" rx="10" fill="#ffffff" stroke="#d9772b" stroke-width="2.2"/>
<text x="170.0" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2a1c">deb2（公開）</text>
<text x="170.0" y="382" text-anchor="middle" font-size="13" fill="#5f6b5a">入口のサーバー</text>
<text x="170.0" y="401" text-anchor="middle" font-size="13" fill="#5f6b5a">外からは 443 だけ</text>
<line x1="400" y1="300" x2="400" y2="336" stroke="#1f2a1c" stroke-width="2.2"/>
<rect x="320" y="336" width="160" height="92" rx="10" fill="#ffffff" stroke="#4f7a34" stroke-width="2.2"/>
<text x="400.0" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2a1c">halo（データ）</text>
<text x="400.0" y="382" text-anchor="middle" font-size="13" fill="#5f6b5a">写真・気象・</text>
<text x="400.0" y="401" text-anchor="middle" font-size="13" fill="#5f6b5a">データベース</text>
<line x1="570" y1="300" x2="570" y2="336" stroke="#1f2a1c" stroke-width="2.2"/>
<rect x="490" y="336" width="160" height="92" rx="10" fill="#ffffff" stroke="#4f7a34" stroke-width="2.2"/>
<text x="570.0" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2a1c">miniPC</text>
<text x="570.0" y="382" text-anchor="middle" font-size="13" fill="#5f6b5a">個人情報</text>
<text x="570.0" y="401" text-anchor="middle" font-size="13" fill="#5f6b5a">盤は暗号化</text>
<line x1="800" y1="300" x2="800" y2="336" stroke="#1f2a1c" stroke-width="2.2"/>
<rect x="710" y="336" width="180" height="92" rx="10" fill="#ffffff" stroke="#356aa0" stroke-width="2.2"/>
<text x="800.0" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2a1c">机の PC</text>
<text x="800.0" y="382" text-anchor="middle" font-size="13" fill="#5f6b5a">作業と管理</text>
<text x="800.0" y="401" text-anchor="middle" font-size="13" fill="#5f6b5a">各機械へ ssh</text>
<line x1="400" y1="428" x2="400" y2="462" stroke="#8a8f86" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="800" y1="428" x2="800" y2="462" stroke="#8a8f86" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="400" y1="462" x2="800" y2="462" stroke="#8a8f86" stroke-width="2" stroke-dasharray="7 5"/>
<text x="600" y="482" font-size="12" fill="#5f6b5a" text-anchor="middle" font-weight="400">二本目の網（今ある線）。残すなら、halo の側で通す口を絞る</text>
<rect x="60" y="502" width="840" height="138" rx="10" fill="#f8faf6" stroke="#1f2a1c" stroke-width="2.2"/>
<text x="480.0" y="526" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2a1c"></text>
<text x="84" y="528" font-size="14" fill="#1f2a1c" text-anchor="start" font-weight="700">通す物（これ以外は通さない）</text>
<rect x="84" y="540" width="10" height="10" fill="#d9772b"/>
<text x="102" y="550" font-size="13" fill="#1f2a1c" text-anchor="start" font-weight="700">外 → deb2</text>
<text x="230" y="550" font-size="13" fill="#5f6b5a" text-anchor="start" font-weight="400">443 だけ（Cloudflare から）</text>
<rect x="84" y="559" width="10" height="10" fill="#4f7a34"/>
<text x="102" y="569" font-size="13" fill="#1f2a1c" text-anchor="start" font-weight="700">deb2 → halo</text>
<text x="230" y="569" font-size="13" fill="#5f6b5a" text-anchor="start" font-weight="400">決めた口だけ（門の口。後でデータベースの口）</text>
<rect x="84" y="578" width="10" height="10" fill="#356aa0"/>
<text x="102" y="588" font-size="13" fill="#1f2a1c" text-anchor="start" font-weight="700">机 → 各機械</text>
<text x="230" y="588" font-size="13" fill="#5f6b5a" text-anchor="start" font-weight="400">ssh（鍵でだけ）</text>
<rect x="84" y="597" width="10" height="10" fill="#4f7a34"/>
<text x="102" y="607" font-size="13" fill="#1f2a1c" text-anchor="start" font-weight="700">miniPC</text>
<text x="230" y="607" font-size="13" fill="#5f6b5a" text-anchor="start" font-weight="400">外からも deb2 からも入れない。出るのは更新と控えだけ</text>
<rect x="84" y="616" width="10" height="10" fill="#1f2a1c"/>
<text x="102" y="626" font-size="13" fill="#1f2a1c" text-anchor="start" font-weight="700">IPv6</text>
<text x="230" y="626" font-size="13" fill="#5f6b5a" text-anchor="start" font-weight="400">入る向きは既定で拒否</text>
</svg>
