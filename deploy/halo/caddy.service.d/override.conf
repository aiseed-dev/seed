# halo の /etc/systemd/system/caddy.service.d/override.conf
# Debian の caddy パッケージの caddy.service に重ねる。手順は deploy/halo/手順.md の c。
#
# 形 A（既定）: EnvironmentFile。/etc/caddy/halo.env は root:root 600。systemd（root）が読んで
# 環境変数で Caddy に渡すので、caddy の利用者はファイルを読めなくてよい。
# 鍵は Caddy のプロセスの環境（/proc/<pid>/environ。root と caddy の利用者だけが読める）には入る。
# 盤の上でも暗号化されない。これを嫌うなら credential.conf.example の形 B に替える（K-03）。

[Service]
EnvironmentFile=/etc/caddy/halo.env

# 元の ExecStart は `caddy run --environ ...`。--environ は起動の時に環境変数を全部ログに出すので、
# token が journal に残る（K-03 に反する）。外して置き直す。
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

# Caddyfile で `admin off` にしたので `caddy reload` は使えない。設定も token も restart で入れ替える。
ExecReload=
