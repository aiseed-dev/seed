# deb2 の seed の秘密の在庫（K-14、K-04、K-05）。kagi の在庫表の形。値は書かない（value の欄があると kagi は止まる。K-13）。
# 使い方（手順.md の b）: 作者の在庫表（inventory.toml）に写し、made と expires を書いてから kagi check inventory。
# made・expires を書かないうちは「抜け」と出る（それで正しい）。置いていない物の行は、置くまで写さない。
# 機械に seed の外の秘密（Cloudflare の origin 証明書の鍵、ほかのサイトの物）があれば、それは持ち主が足す。

[[secret]]
id = "deb2-anthropic-key"
kind = "token"
where = "deb2:/etc/credstore/seed.anthropic（root:root 600。systemd の ImportCredential= が seed.service にだけ渡す。dev も seed も直には読めない）"
holder = "yniji"
role = "seed のサーバーが Claude を呼ぶ（/api/read、/api/talk）。他には使わない（K-01）"
# made = 2026-11-XX
# expires = 2027-02-XX
rotate_days = 90
lost = "Anthropic の Console で新しい鍵を作り、/etc/credstore/seed.anthropic を置き換えて（root:root 600）systemctl restart seed"
leaked = "Console で失効 → Console の使用量で範囲を知る → 新しい鍵を置く → 知らせる → 書く（K-15）"

[[secret]]
id = "deb2-plantnet-key"
kind = "token"
where = "deb2:/etc/credstore/seed.plantnet（root:root 600。ImportCredential= で seed.service にだけ渡す）"
holder = "yniji"
role = "seed のサーバーが Pl@ntNet に草の名を尋ねる（/api/identify）"
# made = 2026-11-XX
# expires = 2027-11-XX
rotate_days = 365
lost = "my.plantnet.org で新しい鍵を作り、/etc/credstore/seed.plantnet を置き換えて（root:root 600）systemctl restart seed"
leaked = "my.plantnet.org で失効 → 使用量で範囲を知る → 新しい鍵を置く → 書く"

[[secret]]
id = "deb2-invites"
kind = "other"
where = "deb2:/etc/seed/invites.toml（root:seed 640。サービスだけが読める）。渡した先は Discord の一人ずつ"
holder = "yniji"
role = "seed の /api/* の門。招待コードは一人に一つ"
# made = 2026-11-XX
# expires = 2027-05-XX
rotate_days = 180
lost = "その人の行を消し（次の要求から効かない）、新しいコードを一行足して渡し直す"
leaked = "その行を消す → /var/lib/seed の公開と記録（audit.log）でその呼び名の物を見る → 新しいコードを渡す → 書く"

[[secret]]
id = "deb2-log-key"
kind = "key"
where = "deb2:/etc/seed/log-key（root:root 600。systemd が seed.service にだけ渡す）"
holder = "yniji"
role = "seed のサーバーの記録（誰が何をしたか）の署名。他には使わない（K-01）"
# made = 2026-11-XX
# expires = 2027-11-XX
rotate_days = 365
lost = "新しい鍵を置いて systemctl restart seed。前の記録は前の鍵でしか確かめられないので、記録のファイルを分けて残す"
leaked = "記録を別の場所に写して確かめる → 新しい鍵 → 記録のファイルを新しくする → 書く（K-15）"

# 相手に出した token（seed token add）は、台帳 /var/lib/seed/gate/tokens.json が在庫表（誰に、範囲、期限、取り消し。ハッシュだけ）。
# 期限は kagi check tokens --file で見る。

[[secret]]
id = "dev-debpc"
kind = "key"
where = "debpc:~/.ssh/id_ed25519（dev）"
holder = "dev"
role = "dev が deb2 と halo に入る ssh の鍵（機械の表の [[key]] と同じ id）"
# made = 20XX-XX-XX
# expires = 2027-11-XX
rotate_days = 365
lost = "新しい鍵を作り、機械の authorized_keys を入れ替える（kagi 手引き §4e の「回す」）"
leaked = "全部の機械の authorized_keys から消す → 機械の auth.log で範囲を知る → 新しい鍵 → 書く"
