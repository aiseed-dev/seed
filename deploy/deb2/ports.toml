# deb2 の口の表（K-07）。seed の配備（docs/deb2 の配備.md）が済んだ後の形。kagi の形（[[port]] の並び）。
# 使い方（手順.md の a）: 作者の作業の場所の ports.toml にこの中身を足し、
#   kagi machine collect --host deb2 → kagi machine check --host deb2
# 配備の前は、8010 が「表にあって開いていない」と出る。それが残りの作業。
# 外から届くのは Cloudflare を通る 443 だけ（22 と 2222 は ufw で決まる。この表は「どの口が開いているか」まで）。
# IP アドレスはこの表に書かない（127.0.0.1 は機械の中の意味なので書く）。

[[port]]
host = "deb2"
port = 22
proto = "tcp"
service = "sshd"
bind = "0.0.0.0"
reason = "作者と dev の管理。鍵でだけ入る形にする（手順 c）"

[[port]]
host = "deb2"
port = 443
proto = "tcp"
service = "caddy"
bind = "*"
reason = "Cloudflare の後ろ。seed、office、aiai、git、auth、analytics の入口"

[[port]]
host = "deb2"
port = 2222
proto = "tcp"
service = "forgejo の ssh（git）"
bind = "*"
reason = "seed の外の物。git の ssh"

[[port]]
host = "deb2"
port = 8010
proto = "tcp"
service = "seed の API（seed.service、uvicorn）"
bind = "127.0.0.1"
reason = "Caddy の後ろ。/api/* と /health だけを通す"

[[port]]
host = "deb2"
port = 8550
proto = "tcp"
service = "office の紹介の頁（aiseed-office-web）"
bind = "127.0.0.1"
reason = "seed の外の物。Caddy の後ろ"

[[port]]
host = "deb2"
port = 8090
proto = "tcp"
service = "PocketBase（auth）"
bind = "127.0.0.1"
reason = "seed の外の物。Caddy の後ろ"

[[port]]
host = "deb2"
port = 3000
proto = "tcp"
service = "forgejo（git）"
bind = "127.0.0.1"
reason = "seed の外の物。Caddy の後ろ"

[[port]]
host = "deb2"
port = 8420
proto = "tcp"
service = "kaiseki（analytics の受け口）"
bind = "127.0.0.1"
reason = "seed の外の物。Caddy の後ろ"

[[port]]
host = "deb2"
port = 2019
proto = "tcp"
service = "caddy の管理の口"
bind = "127.0.0.1"
reason = "機械の中だけ。外向きで出たら直す"

[[port]]
host = "deb2"
port = 631
proto = "tcp"
service = "cups（印刷）"
bind = "127.0.0.1"
reason = "机の PC の形で入れた名残。止めたら、この行を消す（連載 第 5 章: 要らないサービスを止める）"

# 8000 は aiai の申し込みに取ってある口（docs/deb2 の配備.md）。開いたら、ここに 127.0.0.1 で足す。
