[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# PyPI の "seed" は別物。import は seed
name = "seed-farm"
version = "0.0.1"
description = "畑を始めてみませんか。畑の写真を自分の Claude に渡すと、その土地の成り立ち（地質、土、歴史）を調べてくれる。畑を観察し、記録を書いて人と繋がる。自給農から、その次へ。"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Yasuhiro Niji"}]
keywords = ["natural farming", "self-sufficiency", "abandoned farmland", "Claude", "field records"]
dependencies = [
  "pyyaml",   # 記録の前書き
]

[project.optional-dependencies]
app = ["flet[all]==1.1.0", "pillow", "httpx", "pillow-heif", "qrcode", "resvg-py"]                # 本人のアプリ（Web 版も）。iPhone の HEIC を読む
origin = ["pillow", "httpx", "imageio-ffmpeg"]                                   # seed origin（地図と空中写真の動画。mp4 は imageio-ffmpeg）
grow = ["pillow", "httpx", "resvg-py"]                                          # seed grow --draw（図を PNG にして halo で絵に。resvg は wheel だけ）
heic = ["pillow-heif"]                                                          # HEIC だけ要るとき
server = ["fastapi", "uvicorn[standard]", "python-multipart", "anthropic", "pillow", "httpx", "markdown>=3.5"]  # seed.aiseed.dev（markdown は /manual）
# 座標からの照会（seed/lookup.py。地理院、ハザードマップ、土壌図、筆ポリゴンのタイルを読む。numpy は色の面）
lookup = ["numpy", "pillow", "httpx"]
# 写真の覆い％（Meta の SAM 3.1。Meta の鍵がある時だけ）
sam = ["meta-sam-parser", "numpy", "pillow", "openai>=3"]
# 声の書き取り（Meta の Muse Voice Transcribe。電話の録音を av で読む）
voice = ["httpx", "av"]
# 本人の AI から記録を読む（seed mcp）
mcp = ["mcp>=2.3"]
# 撮る画面（スマートフォンのアプリと Web 版。カメラと位置の部品。PC の窓では使わない）
capture = ["flet-camera==1.1.0", "flet-geolocator==1.1.0"]
dev = ["pytest", "ruff", "seed-farm[app,server,grow,capture,lookup,sam,voice,mcp]"]

[project.scripts]
seed = "seed.cli:main"
kagi = "kagi.cli:main"

[project.urls]
Homepage = "https://seed.aiseed.dev"
Source = "https://github.com/aiseed-dev/seed"

# スマートフォンのアプリ（flet build ipa / apk。docs/iPhone 版.md）。入口は src/main.py（[tool.flet.app] の module）
[tool.flet]
product = "seed"
org = "dev.aiseed"
bundle_id = "dev.aiseed.seed"
build_number = 1

[tool.flet.app]
path = "src"
module = "main.py"
exclude = ["kagi", "seed/server", "seed_farm.egg-info"]

[tool.flet.ios]
dependencies = ["flet==1.1.0", "flet-camera==1.1.0", "flet-geolocator==1.1.0", "pillow", "httpx", "pyyaml"]

[tool.flet.ios.info]
NSCameraUsageDescription = "畑の写真を撮ります。"
NSLocationWhenInUseUsageDescription = "撮った所を写真に書き込みます。"

[tool.flet.android]
dependencies = ["flet==1.1.0", "flet-camera==1.1.0", "flet-geolocator==1.1.0", "pillow", "httpx", "pyyaml"]

[tool.flet.android.permission]
"android.permission.CAMERA" = true
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true

[tool.setuptools.packages.find]
where = ["src"]

# 公開サイトの画像（write_site が site/static/ に写す）
[tool.setuptools.package-data]
"seed.server" = ["static/*"]

# 共通の手引き。seed init が <prefix>/share/seed-farm/skill から ~/seed/skill/ に写す（記録の形 §9）
[tool.setuptools.data-files]
"share/seed-farm/skill" = ["skill/*.md"]
"share/seed-farm/skill/plants" = ["skill/plants/*.md"]
"share/seed-farm/skill/plants/miscanthus-sacchariflorus" = ["skill/plants/miscanthus-sacchariflorus/*.md"]
"share/seed-farm/skill/plants/miscanthus-sacchariflorus/figures" = ["skill/plants/miscanthus-sacchariflorus/figures/*"]
"share/seed-farm/skill/plants/miscanthus-sacchariflorus/photos" = ["skill/plants/miscanthus-sacchariflorus/photos/*"]
"share/seed-farm/skill/plants/solidago-altissima" = ["skill/plants/solidago-altissima/*.md"]
"share/seed-farm/skill/plants/solidago-altissima/figures" = ["skill/plants/solidago-altissima/figures/*"]
"share/seed-farm/skill/plants/solidago-altissima/photos" = ["skill/plants/solidago-altissima/photos/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
